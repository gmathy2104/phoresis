<!-- Lane detection review: a bar above the gel; the lanes, their tags and their confidences are drawn on the gel by review-panel.js -->
<div class="gv-review-bar" id="review-panel" role="toolbar" aria-label="Review of the detected lanes" hidden>
    <div class="gv-review-bar-title">
        <i class="bi bi-magic" aria-hidden="true"></i>
        <span id="review-count">0 lanes</span>
        <span id="review-gel-type" class="gv-review-gel-badge"></span>
    </div>

    <label class="gv-review-threshold" title="Lanes the model is at least this sure of are kept; a click on a lane overrides it">
        <span>Min. confidence</span>
        <input type="range" id="review-threshold" min="25" max="95" step="1" value="50">
        <output id="review-threshold-value" for="review-threshold">50 %</output>
    </label>

    <div class="gv-review-shape" role="group" aria-label="Lane shape">
        <button type="button" id="review-shape-straight" aria-pressed="true" title="Upright lanes, as the model's boxes">Straight</button>
        <button type="button" id="review-shape-follow" aria-pressed="false" disabled title="Measuring the lanes' tilt…">
            <i class="bi bi-slash-lg" aria-hidden="true"></i> Follow the lanes
        </button>
    </div>
    <span class="gv-review-cross" id="review-cross" role="status" hidden></span>

    <div class="gv-review-hint">
        <span><kbd>Click</kbd> a lane: keep / drop</span>
        <span><kbd>Click</kbd> its tag: type</span>
        <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> <kbd>Space</kbd></span>
    </div>

    <div class="gv-review-actions">
        <button type="button" class="gv-review-btn" id="review-reject-all" title="Discard every detected lane" aria-label="Reject all">
            <i class="bi bi-x-lg" aria-hidden="true"></i>
            <span>Reject all</span>
        </button>
        <button type="button" class="gv-review-btn gv-review-btn-primary" id="review-accept-selected" title="Create the kept lanes (Ctrl+Enter)">
            <i class="bi bi-check-lg" aria-hidden="true"></i>
            <span id="review-accept-label">Accept 0 lanes</span>
        </button>
    </div>
</div>
