<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phoresis — Login</title>
</head>
<body>
    <h1>Phoresis</h1>
    <h2>Sign in</h2>
    {% if form.non_field_errors %}
        <ul class="errors">
            {% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}
        </ul>
    {% endif %}
    <form method="post" action="{% url 'accounts:login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign in</button>
    </form>
</body>
</html>
