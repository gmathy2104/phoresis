name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DJANGO_SETTINGS_MODULE: phoresis.settings.test
  PYTHON_VERSION: "3.12"

jobs:

  # ───────────────────────── lint ─────────────────────────
  lint:
    name: Lint (ruff + djlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # ───────────────────────── frontend build ─────────────────────────
  frontend:
    name: Frontend (Tailwind build sanity)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20", cache: "npm" }
      - run: npm install
      - run: npm run build:css
      - name: Verify output.css
        run: |
          test -s src/phoresis_ui/static/phoresis_ui/css/output.css
          echo "output.css size: $(stat -c%s src/phoresis_ui/static/phoresis_ui/css/output.css) bytes"

  # ───────────────────────── unit + integration tests ─────────────────────────
  test:
    name: Tests (pytest, Postgres 17 + Redis 7)
    runs-on: ubuntu-24.04
    needs: [lint]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: phoresis
          POSTGRES_USER: phoresis
          POSTGRES_PASSWORD: phoresis
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: phoresis
      DB_USER: phoresis
      DB_PASSWORD: phoresis
      REDIS_HOST: 127.0.0.1
      # Hoist the secret into env so the conditional below can read it.
      # GitHub disallows `secrets.X` in `if:` expressions (anti-exfiltration);
      # `env.X` is permitted and equivalent here.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      # No `lfs: true`: pytest never loads the ML model binaries (they're only
      # touched at inference time, never during test collection or migrations).
      # Skipping LFS here saves ~111 MB of bandwidth per CI run.
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev
      - run: uv run python manage.py migrate --noinput
      - run: uv run pytest -v --create-db --cov=src --cov-report=xml
      - uses: codecov/codecov-action@v5
        if: env.CODECOV_TOKEN != ''
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml

  # ───────────────────────── docker image build (smoke) ─────────────────────────
  # One unified phoresis-app image (was: two separate -web and -worker builds).
  build-cpu:
    name: Build CPU image (smoke)
    runs-on: ubuntu-24.04
    needs: [lint]
    steps:
      # Checkout WITHOUT LFS first; the cache step below restores .git/lfs
      # from the previous run when the model pointer files haven't changed.
      # Cache key is hashed on the LFS pointer files (each pointer embeds the
      # SHA-256 of the actual binary), so any model change invalidates the
      # cache and triggers a fresh `git lfs pull` -- otherwise zero LFS
      # bandwidth is consumed.
      - uses: actions/checkout@v5
      - name: Cache Git LFS objects
        id: lfs-cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('src/gel_analyzer/static/gel_analyzer/ml/**') }}
          restore-keys: |
            ${{ runner.os }}-lfs-
      - name: Pull LFS files (cache miss only) and materialize working copy
        run: |
          if [ "${{ steps.lfs-cache.outputs.cache-hit }}" != "true" ]; then
            echo "Cache miss -- fetching LFS objects from origin"
            git lfs pull
          else
            echo "Cache hit -- reusing previously fetched LFS objects"
          fi
          # `lfs checkout` rewrites pointer files in the working tree with the
          # actual binaries (cached or freshly pulled). Cheap when a no-op.
          git lfs checkout
      - uses: docker/setup-buildx-action@v3
      - name: Build phoresis-app (cpu)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: TORCH_VARIANT=cpu
          push: false
          tags: phoresis-app:ci-cpu
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          outputs: type=docker

  # ───────────────────────── trivy CVE scan ─────────────────────────
  trivy:
    name: Trivy CVE scan
    runs-on: ubuntu-24.04
    needs: [build-cpu]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Rebuild app image (uses cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: TORCH_VARIANT=cpu
          push: false
          tags: phoresis-app:trivy
          cache-from: type=gha
          load: true
      - name: Trivy scan
        # Pinned to the v0.36.0 commit SHA (not a tag) because the
        # aquasecurity/trivy-action repo suffered a March 2026 supply-chain
        # attack: 75+ tags were force-pushed to malicious commits. Tags are
        # mutable; a full commit SHA is not. v0.36.0 was published 2026-04-22,
        # post-remediation. To bump: fetch the new tag's sha via
        #   gh api repos/aquasecurity/trivy-action/git/refs/tags/<tag> --jq .object.sha
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: phoresis-app:trivy
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
