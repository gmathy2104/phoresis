name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build (e.g. v1.2.3)"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: gmathy2104

jobs:

  # ───────────────────────── release-please ─────────────────────────
  release-please:
    name: release-please (open or merge release PR)
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name:        ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # ───────────────────────── build + push (CPU only) ─────────────────────────
  # Ship a single pre-built CPU image (phoresis-app) via GHCR. The same image
  # runs as web (gunicorn), worker (celery worker), and scheduler (celery
  # beat) — they differ only by the runtime CMD set in compose. This halved
  # the CI matrix vs the legacy two-image split (phoresis-web + phoresis-worker)
  # and eliminated duplicate cu128 wheel downloads on the user's machine.
  #
  # CUDA images are NOT built in CI by design: GPU users build them locally
  # during `install.ps1` (cu128 wheels are too big for GitHub-runner disk +
  # build-time ceilings). See `docs/INSTALL.md` for the user-side flow.
  build-and-push:
    name: phoresis-app-cpu
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
        with: { lfs: true }

      - name: Resolve tag (push event vs manual dispatch)
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push phoresis-app:{tag,latest}-cpu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: TORCH_VARIANT=cpu
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/phoresis-app:${{ steps.tag.outputs.value }}-cpu
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/phoresis-app:latest-cpu
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/phoresis-app:buildcache-cpu
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/phoresis-app:buildcache-cpu,mode=max
          provenance: true
          sbom: true

  # ───────────────────────── attach SBOM to GitHub Release ─────────────────────────
  attach-assets:
    name: Attach SBOM + checksums to GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-and-push]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: Resolve tag
        id: tag
        run: echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull SBOM (phoresis-app cpu) and write to file
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/phoresis-app:${{ steps.tag.outputs.value }}-cpu \
            --format '{{ json .SBOM.SPDX }}' > sbom-phoresis-app-cpu.json
          ls -lh sbom-phoresis-app-cpu.json

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: sbom-phoresis-app-cpu.json
          fail_on_unmatched_files: false
