# Vendored static assets (handsontable, bootstrap-icons, etc.) live under
# src/<app>/static/<app>/{js,css}/vendor/ per AGENTS.md §1 — they ship as-is
# from upstream and must NOT be reformatted by ruff / trailing-whitespace
# / end-of-file-fixer. Excluding them globally is simpler than per-hook.
exclude: |
  (?x)^(
    src/.*/static/.*/vendor/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: ['--fix']
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
