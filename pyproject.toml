[project]
name = "phoresis"
version = "0.1.0"
description = "Phoresis — standalone gel electrophoresis analysis platform"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
authors = [{ name = "Grégory Mathy" }]
keywords = ["django", "gel", "electrophoresis", "sds-page", "western-blot", "densitometry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "Django>=5.2,<6.0",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.0",
    "django-redis>=5.4",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "django-filter>=24.3",
    "django-simple-history>=3.8",
    "loguru>=0.7",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "Pillow>=10.4",
    # Scientific stack — required by gel_analyzer services (Phase 2)
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-python>=4.10",
    "tifffile>=2024.7",
    "scikit-image>=0.24",
    "torch>=2.4",
    "onnxruntime>=1.19",
    # Phase 4 — report generation
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "matplotlib>=3.9",          # used by report charts (terrain, poi_purity)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "ruff>=0.7",
    "pre-commit>=4.0",
    "ipython>=8.27",
    "playwright>=1.48",
    "pytest-playwright>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phoresis", "src/phoresis_core", "src/accounts", "src/dashboard", "src/phoresis_ui"]

# ===== Ruff =====
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",   # line length (formatter handles it)
    "B008",   # Django: do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501", "F401", "I001"]
"__init__.py" = ["F401"]
"src/phoresis/settings/*" = ["F401", "F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["phoresis", "phoresis_core", "accounts", "dashboard", "phoresis_ui", "gel_analyzer"]
section-order = ["future", "standard-library", "third-party", "django", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
django = ["django"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ===== Pytest =====
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "phoresis.settings.test"
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["src"]
addopts = ["--strict-markers", "-ra", "-m", "not e2e"]
testpaths = ["src", "tests/e2e"]
markers = [
    "e2e: end-to-end tests requiring a live server + browser (slow; opt in with -m e2e)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ===== Coverage =====
[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/migrations/*", "*/tests/*", "*/test_*.py", "src/phoresis/wsgi.py", "src/phoresis/asgi.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true
