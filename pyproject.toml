[project]
name = "phoresis"
version = "1.3.0"
description = "Phoresis — standalone gel electrophoresis analysis platform"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
authors = [{ name = "Grégory Mathy" }]
keywords = ["django", "gel", "electrophoresis", "sds-page", "western-blot", "densitometry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "Django>=5.2,<6.0",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.0",
    "django-redis>=5.4",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "django-filter>=24.3",
    "django-simple-history>=3.8",
    "loguru>=0.7",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "Pillow>=10.4",
    # Scientific stack — required by gel_analyzer services (Phase 2)
    "numpy>=2.0",
    "scipy>=1.13",
    # OpenCV 5 is a major release of the library the classical band detector is validated on: stay on 4.x
    # until the detector is re-validated on real gels (gel_analyzer tests: the frozen default-hybrid case).
    "opencv-python>=4.10,<5",
    "tifffile>=2024.7",
    "scikit-image>=0.24",
    "onnxruntime>=1.19",
    # Phase 4 — report generation
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "matplotlib>=3.9",          # used by report charts (terrain, poi_purity)
    # Sign-in hardening: lockout after failed logins, TOTP two-factor, the QR code of its setup page
    "django-axes>=8.0",
    "django-otp>=1.6",
    "qrcode>=8.0",
]

# torch (+ torchvision + ultralytics) live in two mutually-exclusive extras so
# wheels come from the right index in one shot — no more "install CPU then
# swap to cu128" dance. Pick one at install time:
#   uv sync --extra cpu   (developer laptops without an NVIDIA GPU)
#   uv sync --extra cuda  (production worker on a Blackwell sm_120 box, etc.)
# torchvision + ultralytics are kept available so the Celery worker can run
# server-side YOLO inference (planned auto-lane detection pipeline) — they
# install zero-bandwidth on top of torch since their wheels are tiny.
[project.optional-dependencies]
cpu = [
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",
]
cuda = [
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",
]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "ruff>=0.7",
    "pre-commit>=4.0",
    "ipython>=8.27",
]

# uv 0.5+ per-package indices: tells uv where to fetch torch from depending on
# the active extra. With `explicit = true`, the index is *only* consulted for
# packages explicitly mapped to it via [tool.uv.sources] — the rest of the
# dep tree still resolves from PyPI.
[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phoresis", "src/phoresis_core", "src/accounts", "src/dashboard", "src/phoresis_ui"]

# ===== Ruff =====
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",   # line length (formatter handles it)
    "B008",   # Django: do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501", "F401", "I001"]
"__init__.py" = ["F401"]
"src/phoresis/settings/*" = ["F401", "F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["phoresis", "phoresis_core", "accounts", "dashboard", "phoresis_ui", "gel_analyzer", "guided_tours"]
section-order = ["future", "standard-library", "third-party", "django", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
django = ["django"]

[tool.ruff.format]
# Markdown is documentation written by hand: ruff (0.16+) would reformat every Python
# code block in it, including the deliberately elided examples of the design docs.
exclude = ["*.md"]
quote-style = "double"
indent-style = "space"

# ===== Pytest =====
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "phoresis.settings.test"
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["src"]
addopts = ["--strict-markers", "-ra"]
testpaths = ["src"]
markers = [
    "unit: a test of one function or class, no HTTP round trip",
    "integration: a test that goes through the views or the API",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ===== Coverage =====
[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/migrations/*", "*/tests/*", "*/test_*.py", "src/phoresis/wsgi.py", "src/phoresis/asgi.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true
