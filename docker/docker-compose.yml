# Phoresis — local laptop deployment stack (Phase 5).
#
# Postgres is intentionally NOT in here — it stays native on the Windows host
# (per spec §9.1) so `docker compose down -v` can never wipe user data.
# Containers reach it via host.docker.internal:5432.

name: phoresis

services:

  # ────────────────────── reverse proxy + TLS ──────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - phoresis_staticfiles:/srv/staticfiles:ro
      - phoresis_media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [phoresis_net]
    labels:
      com.centurylinklabs.watchtower.enable: "false"   # Caddy not auto-updated by Watchtower

  # ────────────────────── Phoresis app (shared image) ──────────────────────
  # web, worker, and scheduler all run the SAME image (phoresis-app) — they
  # differ only by their CMD and a couple of SKIP_* env flags. This halves
  # build/pull/storage cost vs the legacy two-image split (Dockerfile.web +
  # Dockerfile.worker).
  #
  # Default: public GHCR image (no docker login required).
  # For private-image deployments (private repo or private GHCR package):
  #   1. Create a GitHub Personal Access Token (CLASSIC -- fine-grained PATs
  #      are not supported by GHCR as of 2026/05). Scopes:
  #          - `repo`            (required: GHCR inherits visibility from the
  #                               source repo; private repos need this scope)
  #          - `read:packages`   (required: pull images from ghcr.io)
  #   2. On the host, run:
  #          $env:CR_PAT = "<PAT>"
  #          $env:CR_PAT | docker login ghcr.io -u <gh-user> --password-stdin
  #      This writes credentials to `%USERPROFILE%\.docker\config.json`
  #      (Windows) or `~/.docker/config.json` (Linux/macOS).
  #   3. Watchtower needs the same credentials -- uncomment the volume mount
  #      on the `watchtower:` service below (NOT env vars; WATCHTOWER_AUTH_*
  #      doesn't exist in upstream Watchtower). See docs/INSTALL.md §1b.
  web:
    image: &phoresis_image ${PHORESIS_APP_IMAGE:-ghcr.io/gmathy2104/phoresis-app:latest-${PHORESIS_IMAGE_VARIANT:-cpu}}
    # `build:` lets `docker compose build` produce a local image tagged with
    # the `image:` value above. CPU builds normally pull from GHCR; CUDA users
    # build locally (cu128 wheels too big for GitHub-runner disk).
    build: &phoresis_build
      context: ..
      dockerfile: docker/Dockerfile
      args:
        TORCH_VARIANT: ${PHORESIS_IMAGE_VARIANT:-cpu}
    restart: unless-stopped
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: phoresis.settings.prod
      DB_HOST: host.docker.internal
      REDIS_HOST: redis
      GUNICORN_WORKERS: 4
    volumes:
      - phoresis_staticfiles:/srv/staticfiles
      - phoresis_media:/srv/media
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [phoresis_net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz/live/', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # start_period 180s covers: collectstatic (~60-90s for ~700 hashed +
      # gzipped files) + seed_groups + seed_ladder_templates +
      # create_initial_users + gunicorn boot. Failing probes during this
      # window don't count toward `retries`.
      start_period: 180s
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ────────────────────── Celery worker ──────────────────────
  # Same image as web; different CMD + SKIP_* envs. NO `build:` block here —
  # if both web and worker declared a build, `docker compose build` would
  # build the same image twice (BuildKit caches the 2nd, but it's wasteful
  # and confusing). With the build only on web, `compose build` produces a
  # single image tagged `phoresis-app:…`; `compose up` then starts worker
  # and scheduler from that locally-tagged image without re-pulling.
  worker:
    image: *phoresis_image
    restart: unless-stopped
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: phoresis.settings.prod
      DB_HOST: host.docker.internal
      REDIS_HOST: redis
      SKIP_COLLECTSTATIC: "1"
      SKIP_SEEDS: "1"
    volumes:
      - phoresis_media:/srv/media
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy   # ensures migrations are done before worker starts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [phoresis_net]
    command: ["celery", "-A", "phoresis_core.celery_app", "worker", "--loglevel=info", "-Q", "default,heavy", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A phoresis_core.celery_app inspect ping --timeout 3 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ────────────────────── Celery beat (scheduler) ──────────────────────
  # Same image as web/worker; different CMD. No healthcheck (beat has no
  # equivalent ping endpoint — its liveness is implied by the worker still
  # picking up scheduled tasks).
  scheduler:
    image: *phoresis_image
    restart: unless-stopped
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: phoresis.settings.prod
      DB_HOST: host.docker.internal
      REDIS_HOST: redis
      SKIP_COLLECTSTATIC: "1"
      SKIP_SEEDS: "1"
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [phoresis_net]
    # `--schedule /home/phoresis/celerybeat-schedule.db` redirects beat's
    # persistence file out of WORKDIR (/app, owned by root) into the phoresis
    # user's home directory (writable). Default behaviour writes to ./, which
    # silently crashloops with `[Errno 13] Permission denied` because /app is
    # not writable for non-root users. The schedule file is regenerated from
    # settings on every start, so no volume mount is needed for persistence.
    command: ["celery", "-A", "phoresis_core.celery_app", "beat", "--loglevel=info", "--schedule", "/home/phoresis/celerybeat-schedule.db"]
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ────────────────────── Redis (broker + cache) ──────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - phoresis_redis:/data
    networks: [phoresis_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  # ────────────────────── Watchtower (auto-update) ──────────────────────
  # Per spec §10.2 — pulls new images at 03:00 daily and restarts only the
  # containers labelled `watchtower.enable=true` (web, worker, scheduler).
  # Phase 6 will harden the credentials story and the notification URL.
  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"           # remove old images
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_SCHEDULE: "0 0 3 * * *"   # 03:00 daily
      WATCHTOWER_NOTIFICATION_URL: "${WATCHTOWER_NOTIFICATION_URL:-}"
      TZ: "${TZ:-Europe/Brussels}"
      # Watchtower 1.7.1 ships with an old Docker SDK that negotiates API
      # v1.25 by default. Modern Docker Desktop bumps its minimum-supported
      # API version over time -- v1.41 was rejected by Docker Engine 25+
      # ("client version 1.41 is too old, min 1.44"). Pin to 1.44 (current
      # daemon minimum as of Docker Desktop 4.x / Engine 25+).
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Private GHCR auth: uncomment the next line after `docker login ghcr.io`
      # on the host. Watchtower reads credentials from /config.json inside the
      # container (official upstream mechanism -- env-var-based auth such as
      # WATCHTOWER_AUTH_USERNAME does NOT exist in containrrr/watchtower).
      # - ${USERPROFILE:-${HOME}}/.docker/config.json:/config.json:ro
    networks: [phoresis_net]

networks:
  phoresis_net:
    driver: bridge

volumes:
  phoresis_staticfiles:
  phoresis_redis:
  caddy_data:
  caddy_config:
  # phoresis_media holds user-uploaded gel images, generated display PNGs,
  # thumbnails, and exports. Switched from a host bind mount in v1.0.37
  # because Docker Desktop's WSL2 file sharing on Windows produced
  # silent divergence between web (writes) and caddy (reads).
  #
  # `external: true` (v1.0.38) protects user data: compose down -v will
  # NOT remove this volume, because compose treats externally-managed
  # volumes as off-limits. install.ps1 calls `docker volume create
  # phoresis_phoresis_media` ahead of first compose up; subsequent runs
  # are no-ops. To actually wipe media (e.g. to test a fresh install),
  # use scripts/wipe-media.ps1, which auto-backs up first and requires
  # explicit triple confirmation.
  phoresis_media:
    external: true
    name: phoresis_phoresis_media
